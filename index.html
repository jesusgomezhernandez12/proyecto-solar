<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar 3D Interactivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="stars"></canvas>
    <div id="title">SISTEMA SOLAR 3D</div>

    <div id="scene">
        <div id="solar-system">
            <div class="sun" data-planet="sun"></div>
        </div>
    </div>

    <div id="info-panel">
        <button id="close-panel">&times;</button>
        <h2 id="planet-name"></h2>
        <div id="planet-info"></div>
    </div>

    <div id="controls">
        <label>Velocidad:</label>
        <input type="range" id="speed-control" min="1" max="100" value="30">
        <button id="toggle-rotation">Pausar</button>
        <button id="reset-view">Reiniciar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
